# ── Server ──────────────────────────────────────────────────────
sonar.host.url=http://localhost:9000

# ── Project Identification ──────────────────────────────────────
sonar.projectKey=terminalize
sonar.projectName=Terminalize
sonar.projectVersion=0.5.1

# ── Source Encoding ─────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Source & Test Directories ───────────────────────────────────
sonar.sources=src
sonar.tests=src,test

# ── Test File Patterns ──────────────────────────────────────────
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**

# ── Exclusions ──────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.config.mjs

# ── Coverage Reports (generate first with: pnpm test:cov) ───────
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── Coverage Exclusions ─────────────────────────────────────────
sonar.coverage.exclusions=\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/index.ts
