name: Bug Report
description: Report a bug to help us improve terminalize
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: terminalize version
      description: Run `npx terminalize --version`
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: AI Agent
      options: [OpenCode, Claude Code, Cursor, Gemini CLI, Windsurf, Kiro CLI, Other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Copy any error messages or terminal output
      render: shell
