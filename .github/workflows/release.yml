name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - name: Pack npm artifact
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          TAG="v${VERSION}"
          TARBALL="$(find artifacts -maxdepth 1 -name "terminalize-${VERSION}.tgz" | head -n 1)"

          if [ -z "$TARBALL" ]; then
            echo "Expected tarball for ${TAG} was not found under artifacts/" >&2
            exit 1
          fi

          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
      - name: Check npm publication state
        id: npm_state
        shell: bash
        run: |
          if npm view "${{ steps.meta.outputs.package_name }}@${{ steps.meta.outputs.version }}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate CycloneDX SBOM
        run: pnpm sbom:generate
      - name: Generate checksums
        run: pnpm checksums:generate
      - name: Verify generated checksums
        run: pnpm verify:checksums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terminalize-release-artifacts
          path: |
            ${{ steps.meta.outputs.tarball }}
            artifacts/*.cdx.json
            artifacts/SHASUMS256.txt
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.meta.outputs.tarball }}
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.meta.outputs.tarball }}
          sbom-path: artifacts/terminalize.cdx.json
      - if: steps.npm_state.outputs.published != 'true'
        run: npm publish "./${{ steps.meta.outputs.tarball }}" --provenance
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.meta.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.meta.outputs.tag }}" "./${{ steps.meta.outputs.tarball }}" artifacts/terminalize.cdx.json artifacts/SHASUMS256.txt --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ steps.meta.outputs.tag }}" "./${{ steps.meta.outputs.tarball }}" artifacts/terminalize.cdx.json artifacts/SHASUMS256.txt --repo "${{ github.repository }}" --title "${{ steps.meta.outputs.tag }}" --generate-notes
          fi
